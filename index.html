<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex 启动动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  overflow:hidden;
  font-family:system-ui, sans-serif;
}
.boot-screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999;
  animation: fadeOut 1s ease-out 4s forwards;
}
.codex-text{
  font-size:72px;
  color:#fff;
  letter-spacing:12px;
  text-shadow: 0 0 8px #38bdf8, 0 0 22px #0ea5e9;
  opacity:0;
  animation: logoIn 2s ease forwards, breathe 1.5s ease-in-out 2s infinite alternate;
}
.tip{
  margin-top:32px;
  color:#94a3b8;
  font-size:14px;
  opacity:0;
  animation: logoIn 2s ease 1s forwards;
}
@keyframes logoIn{
  from{opacity:0; transform:scale(0.9)}
  to{opacity:1; transform:scale(1)}
}
@keyframes breathe{
  from{text-shadow:0 0 8px #38bdf8,0 0 22px #0ea5e9}
  to{text-shadow:0 0 14px #38bdf8,0 0 35px #0ea5e9}
}
@keyframes fadeOut{
  to{opacity:0;pointer-events:none}
}
.content{
  width:100vw;
  height:100vh;
  color:white;
  display:grid;
  place-items:center;
  font-size:24px;
}
</style>
</head>
<body>
<div class="boot-screen">
  <div class="codex-text">CODEX</div>
  <div class="tip">系统启动中 · 请稍候</div>
</div>
<div class="content">
  动画播放完毕
</div>
</body>
</html>
